# GitHub Actions CI for a Python project that runs Blueprint A's gates (ticket 99). Copy it to
# .github/workflows/ci.yml in the project. It runs what a role's gates run locally, on Linux:
# ruff (lint and format), mypy, pytest with coverage, bandit, Semgrep's p/python rules (Semgrep runs
# here, not on Windows, where its native support is experimental) and pip-audit. Mutation (cosmic-ray)
# and CRAP stay with the hardener's local gate. The tools are the project's dev dependencies: replace
# the install step with the project's own (`uv sync --dev`, `pip install -e ".[dev]"`) when it has one.

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest "coverage>=7.10" ruff mypy bandit pip-audit
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests with coverage
        run: |
          coverage run -m pytest -q --junitxml=pytest-junit.xml
          coverage report
      - name: Security (bandit)
        run: bandit -q -r src
      - name: Security (Semgrep p/python)
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --error --metrics=off
      - name: Known vulnerabilities (pip-audit)
        run: pip-audit
